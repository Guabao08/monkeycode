services:
  - type: web
    name: monkeycode
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    disk:
      name: execution-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: MONKEYCODE_HOST
        value: 0.0.0.0
      - key: MONKEYCODE_SERVE_WEB
        value: 'true'
      - key: MONKEYCODE_DB_PATH
        value: /var/data/execution.sqlite
      - key: MONKEYCODE_EXECUTION_ENABLED
        value: 'false'
      - key: ONLINECOMPILER_API_KEY
        sync: false
      - key: ONLINECOMPILER_RETENTION_ACCEPTED
        sync: false
      - key: MONKEYCODE_INVITES_JSON
        sync: false
